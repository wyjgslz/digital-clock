name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 恢复签名密钥（可选）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p .signing
            echo "$KEYSTORE_B64" | base64 -d > .signing/clock.jks
            echo "已使用仓库密钥签名"
          else
            echo "未配置 KEYSTORE_B64，本次使用临时生成的密钥签名（签名与正式版不同）"
          fi

      - name: 准备 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;33.0.1" >/dev/null
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: 构建
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'clock2026' }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'clock' }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -lh build/DigitalClock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DigitalClock-apk
          path: build/DigitalClock.apk

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DigitalClock.apk
          generate_release_notes: true
          name: 数字时钟 ${{ github.ref_name }}
