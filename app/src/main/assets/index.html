<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080a">
<title>数字时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; background: transparent; border: none; color: inherit; padding: 0; }

  :root {
    --bg: #07080a;
    --bg2: #131519;
    --num: #f5f2e9;
    --sub: rgba(245, 242, 233, 0.55);
    --line: rgba(245, 242, 233, 0.14);
    --panel: rgba(20, 22, 26, 0.92);
    --accent: #7fd4ff;

    --font: "Helvetica Neue", Roboto, system-ui, sans-serif;
    --weight: 300;
    --track: -0.015em;
    --scale: 1;
    --clock-size: 100px;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--num);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    transition: background-color 0.4s ease;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(130% 100% at 50% 30%, var(--bg2) 0%, transparent 68%),
      var(--bg);
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 18px;
  }

  /* ---------- weather ---------- */
  .weather {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--sub);
    margin-bottom: 2.2vh;
    min-height: 20px;
    transition: opacity 0.4s ease;
  }
  .weather .icon { font-size: 1.05em; }
  .weather .temp { color: var(--num); opacity: 0.88; font-variant-numeric: tabular-nums; }
  .weather .dot { opacity: 0.4; }

  /* ---------- clock ---------- */
  .clock {
    display: flex;
    align-items: baseline;
    justify-content: center;
    line-height: 0.92;
    font-weight: var(--weight);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    letter-spacing: var(--track);
    white-space: nowrap;
  }
  .clock .num { font-size: calc(var(--clock-size) * var(--scale)); }

  .clock .colon {
    font-size: calc(var(--clock-size) * var(--scale));
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.13em;
    align-self: center;
    opacity: 1;
    transition: opacity 0.18s linear;
    padding: 0 0.055em;
    position: relative;
    top: 0.015em;
  }
  .clock .colon i {
    display: block;
    width: 0.072em;
    height: 0.072em;
    border-radius: 50%;
    background: currentColor;
  }
  .clock .secwrap {
    display: inline-flex;
    align-items: baseline;
    font-size: calc(var(--clock-size) * var(--scale) * 0.40);
    color: var(--sub);
    margin-left: 0.10em;
    letter-spacing: 0;
  }
  .clock .secwrap .colon2 {
    display: inline-flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.16em;
    padding-right: 0.06em;
    align-self: center;
    opacity: 1;
  }
  .clock .secwrap .colon2 i {
    display: block;
    width: 0.20em;
    height: 0.20em;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.85;
  }

  .ampm {
    font-size: calc(var(--clock-size) * var(--scale) * 0.20);
    color: var(--sub);
    margin-left: 0.35em;
    letter-spacing: 0.12em;
    align-self: flex-start;
    margin-top: 0.2em;
  }

  /* ---------- date / lunar ---------- */
  .meta {
    display: flex;
    align-items: center;
    gap: 0.7em;
    margin-top: 2.6vh;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--sub);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .meta .sep { opacity: 0.4; }
  .meta .lunar { opacity: 0.9; }

  /* ---------- gear ---------- */
  .gear {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 20;
    opacity: 0.65;
  }
  body.light .gear { background: rgba(0, 0, 0, 0.05); }

  /* ---------- settings sheet ---------- */
  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    border-top: 1px solid var(--line);
    transform: translateY(105%);
    transition: transform 0.32s cubic-bezier(.3,.8,.3,1);
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-head {
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }
  .sheet-head .title { font-size: 15px; letter-spacing: 0.16em; color: var(--sub); }
  .sheet-head .done {
    font-size: 14px;
    color: var(--num);
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid var(--line);
    opacity: 0.95;
  }

  .sheet-body {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 20px calc(26px + env(safe-area-inset-bottom));
  }

  .group { margin-top: 18px; }
  .group-label {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--sub);
    opacity: 0.8;
    margin-bottom: 10px;
  }

  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 500;
    position: relative;
  }
  .swatch.active { border-color: var(--accent); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .row .name { font-size: 14px; letter-spacing: 0.04em; color: var(--num); opacity: 0.85; }

  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
  }
  .seg button {
    padding: 7px 12px;
    font-size: 12.5px;
    background: transparent;
    color: var(--sub);
    border: none;
    font-family: inherit;
    letter-spacing: 0.06em;
  }
  .seg button.on { background: rgba(255, 255, 255, 0.12); color: var(--num); }
  .seg.full { width: 100%; }
  .seg.full button { flex: 1; text-align: center; padding: 9px 4px; }

  @media (orientation: landscape) and (max-height: 560px) {
    .app { max-width: 96vw; }
    .weather { margin-bottom: 1.2vh; }
    .meta { margin-top: 1.4vh; }
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 42px;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    padding: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 150px;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--num);
  }

  .switch {
    width: 44px;
    height: 25px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.12);
    position: relative;
    transition: background 0.2s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(19px); }

  .city-line { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .city-input {
    flex: 1;
    min-width: 0;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    color: var(--num);
    font-family: inherit;
    font-size: 13.5px;
  }
  .mini-btn {
    padding: 9px 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.07);
    color: var(--num);
    font-family: inherit;
    font-size: 13px;
    white-space: nowrap;
  }
  .city-results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .city-item {
    text-align: left;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: var(--num);
    font-family: inherit;
    font-size: 13px;
  }
  .city-item small { color: var(--sub); margin-left: 6px; letter-spacing: 0.04em; }
  .hintline { font-size: 12px; color: var(--sub); opacity: 0.7; margin-top: 8px; line-height: 1.5; }

  select.hour-select {
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--num);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 7px 9px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="weather" id="weather">
    <span class="icon" id="wIcon">○</span>
    <span class="temp" id="wTemp">--°</span>
    <span id="wText">载入中</span>
    <span class="dot">·</span>
    <span id="wCity">兰州</span>
  </div>

  <div class="clock" id="clock">
    <span class="num" id="hh">--</span><span class="colon" id="c1"><i></i><i></i></span><span class="num" id="mm">--</span><span class="secwrap" id="secwrap"><span class="colon2" id="c2"><i></i><i></i></span><span id="ss">--</span></span><span class="ampm" id="ampm"></span>
  </div>

  <div class="meta">
    <span id="dateL" class="dateline"></span>
    <span class="sep" id="sepDate">·</span>
    <span id="lunarL" class="lunar"></span>
  </div>
</div>

<button class="gear" id="gear" aria-label="设置">☰</button>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="title">显示设置</span>
    <button class="done" id="done">完成</button>
  </div>
  <div class="sheet-body">

    <div class="group">
      <div class="group-label">配色方案</div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="group">
      <div class="row">
        <span class="name">数字颜色</span>
        <input type="color" id="numColor">
      </div>
      <div class="row">
        <span class="name">背景颜色</span>
        <input type="color" id="bgColor">
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span class="name">字体</span>
        <div class="seg" id="fontSeg">
          <button data-v="sans">无衬线</button>
          <button data-v="mono">等宽</button>
          <button data-v="serif">衬线</button>
        </div>
      </div>
      <div class="row">
        <span class="name">字重</span>
        <div class="seg" id="weightSeg">
          <button data-v="200">细</button>
          <button data-v="300">中细</button>
          <button data-v="500">中</button>
          <button data-v="700">粗</button>
        </div>
      </div>
      <div class="row">
        <span class="name">字号</span>
        <input type="range" id="sizeRange" min="80" max="130" value="100">
      </div>
      <div class="row">
        <span class="name">字距</span>
        <input type="range" id="trackRange" min="-6" max="10" value="-1">
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span class="name">显示秒</span>
        <div class="switch on" id="swSec"></div>
      </div>
      <div class="row">
        <span class="name">显示日期</span>
        <div class="switch on" id="swDate"></div>
      </div>
      <div class="row">
        <span class="name">显示农历</span>
        <div class="switch on" id="swLunar"></div>
      </div>
      <div class="row">
        <span class="name">显示天气</span>
        <div class="switch on" id="swWeather"></div>
      </div>
      <div class="row">
        <span class="name">24 小时制</span>
        <div class="switch on" id="sw24"></div>
      </div>
      <div class="row">
        <span class="name">冒号闪烁</span>
        <div class="switch on" id="swColon"></div>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span class="name">整点报时</span>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="mini-btn" id="chimeTest" style="padding:6px 12px;font-size:12px">试听</button>
          <div class="switch on" id="swChime"></div>
        </div>
      </div>
      <div class="row">
        <span class="name">铃声</span>
        <div class="seg" id="soundSeg">
          <button data-v="dingdong">叮咚</button>
          <button data-v="wood">木鱼</button>
          <button data-v="bell">教堂钟</button>
          <button data-v="beep">电子嘀</button>
        </div>
      </div>
      <div class="row">
        <span class="name">音量</span>
        <input type="range" id="volRange" min="10" max="100" value="80">
      </div>
      <div class="row">
        <span class="name">夜间静音</span>
        <div class="switch on" id="swQuiet"></div>
      </div>
      <div class="row">
        <span class="name">静音时段</span>
        <div style="display:flex;align-items:center;gap:6px">
          <select class="hour-select" id="quietStart"></select>
          <span style="font-size:12px;color:var(--sub)">至</span>
          <select class="hour-select" id="quietEnd"></select>
        </div>
      </div>
      <div class="hintline">每个整点响一次，仅在 App 打开时生效；静音时段内不响</div>
    </div>

    <div class="group">
      <div class="group-label">屏幕方向</div>
      <div class="seg full" id="orientSeg">
        <button data-v="auto">自动旋转</button>
        <button data-v="land">锁定横屏</button>
        <button data-v="port">锁定竖屏</button>
      </div>
      <div class="hintline" id="orientHint">锁定方向在安装版中生效，本机旋转即可</div>
    </div>

    <div class="group">
      <div class="group-label">天气城市</div>
      <div class="city-line">
        <input class="city-input" id="cityInput" placeholder="输入城市名，如 北京" />
        <button class="mini-btn" id="citySearch">搜索</button>
      </div>
      <div class="row" style="border:none;padding-top:8px">
        <span class="name">自动定位</span>
        <div class="switch on" id="swAuto"></div>
      </div>
      <div class="city-results" id="cityResults"></div>
      <div class="hintline" id="cityHint">当前使用：兰州</div>
    </div>

    <div class="group">
      <button class="mini-btn" id="resetBtn" style="width:100%">恢复默认设置</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULTS = {
    bg: "#07080a",
    num: "#f5f2e9",
    font: "sans",
    weight: 300,
    size: 100,
    track: -1,
    showSec: true,
    showDate: true,
    showLunar: true,
    showWeather: true,
    h24: true,
    colon: true,
    chime: true,
    sound: "dingdong",
    volume: 80,
    quietOn: true,
    quietStart: 23,
    quietEnd: 7,
    orient: "auto",
    auto: true,
    lat: 36.0611,
    lon: 103.8343,
    city: "兰州"
  };

  var PRESETS = [
    { name: "曜石", bg: "#07080a", num: "#f5f2e9" },
    { name: "午夜蓝", bg: "#050c1a", num: "#a8c8ff" },
    { name: "墨绿", bg: "#04140f", num: "#9df0c8" },
    { name: "暖砂", bg: "#efe7d8", num: "#1b1d22" },
    { name: "樱白", bg: "#fbf6f2", num: "#252122" },
    { name: "霓虹", bg: "#0a0512", num: "#ff8ad4" }
  ];

  var FONTS = {
    sans: '"Helvetica Neue", Roboto, system-ui, sans-serif',
    mono: '"Roboto Mono", ui-monospace, Menlo, monospace',
    serif: 'Georgia, "Noto Serif SC", "Songti SC", serif'
  };

  var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
  var ZODIAC = ["鼠", "牛", "虎", "兔", "龙", "蛇", "马", "羊", "猴", "鸡", "狗", "猪"];
  var CN = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

  var WCODE = {
    0: ["☀", "晴"], 1: ["🌤", "晴间多云"], 2: ["⛅", "多云"], 3: ["☁", "阴"],
    45: ["🌫", "雾"], 48: ["🌫", "雾凇"],
    51: ["🌦", "毛毛雨"], 53: ["🌦", "小雨"], 55: ["🌦", "细雨"],
    56: ["🌧", "冻雨"], 57: ["🌧", "冻雨"],
    61: ["🌧", "小雨"], 63: ["🌧", "中雨"], 65: ["🌧", "大雨"],
    66: ["🌧", "冻雨"], 67: ["🌧", "冻雨"],
    71: ["🌨", "小雪"], 73: ["🌨", "中雪"], 75: ["❄", "大雪"], 77: ["❄", "雪粒"],
    80: ["🌦", "阵雨"], 81: ["🌧", "阵雨"], 82: ["⛈", "强阵雨"],
    85: ["🌨", "阵雪"], 86: ["🌨", "阵雪"],
    95: ["⛈", "雷阵雨"], 96: ["⛈", "雷雨冰雹"], 99: ["⛈", "雷雨冰雹"]
  };

  /* ---------------- storage ---------------- */
  function loadSettings() {
    try {
      var raw = localStorage.getItem("fc.settings.v2");
      if (raw) {
        var o = JSON.parse(raw);
        for (var k in DEFAULTS) if (o[k] === undefined) o[k] = DEFAULTS[k];
        return o;
      }
    } catch (e) {}
    return JSONCopy(DEFAULTS);
  }
  function JSONCopy(o) { return JSON.parse(JSON.stringify(o)); }
  function saveSettings() {
    try { localStorage.setItem("fc.settings.v2", JSON.stringify(S)); } catch (e) {}
  }

  var S = loadSettings();

  /* ---------------- color helpers ---------------- */
  function hex2rgb(hex) {
    hex = String(hex || "").replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
    return {
      r: parseInt(hex.slice(0, 2), 16) || 0,
      g: parseInt(hex.slice(2, 4), 16) || 0,
      b: parseInt(hex.slice(4, 6), 16) || 0
    };
  }
  function rgba(hex, a) {
    var c = hex2rgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  }
  function mix(hexA, hexB, t) {
    var a = hex2rgb(hexA), b = hex2rgb(hexB);
    function part(x, y) { var v = Math.round(x * (1 - t) + y * t); return Math.max(0, Math.min(255, v)); }
    return "#" + [part(a.r, b.r), part(a.g, b.g), part(a.b, b.b)].map(function (v) {
      return ("0" + v.toString(16)).slice(-2);
    }).join("");
  }
  function isLight(hex) {
    var c = hex2rgb(hex);
    return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) > 150;
  }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    var root = document.documentElement;
    root.style.setProperty("--bg", S.bg);
    root.style.setProperty("--bg2", mix(S.bg, S.num, 0.10));
    root.style.setProperty("--num", S.num);
    root.style.setProperty("--sub", rgba(S.num, 0.55));
    root.style.setProperty("--line", rgba(S.num, 0.16));
    root.style.setProperty("--accent", S.num);
    root.style.setProperty("--panel", isLight(S.bg) ? "rgba(250,248,244,0.94)" : "rgba(18,20,24,0.94)");
    root.style.setProperty("--font", FONTS[S.font] || FONTS.sans);
    root.style.setProperty("--weight", S.weight);
    root.style.setProperty("--track", (S.track / 100) + "em");

  function fitClock() {
    var root = document.documentElement;
    var clock = document.getElementById("clock");
    root.style.setProperty("--clock-size", "100px");
    root.style.setProperty("--scale", S.size / 100);
    var w = clock.scrollWidth || 1;
    var h = clock.scrollHeight || 1;
    var availW = Math.min(window.innerWidth, root.clientWidth) * 0.90;
    var vw = Math.min(window.innerWidth, root.clientWidth);
    var vh = Math.min(window.innerHeight, root.clientHeight);
    var availH = vh * (vw > vh ? 0.50 : 0.42);
    var size = Math.min(100 * availW / w, 100 * availH / h);
    size = Math.max(28, size);
    root.style.setProperty("--clock-size", Math.round(size * 10) / 10 + "px");

  /* ---------------- lunar ---------------- */
  function cnDay(n) {
    if (n === 10) return "初十";
    if (n === 20) return "二十";
    if (n === 30) return "三十";
    if (n < 10) return "初" + CN[n];
    if (n < 20) return "十" + CN[n - 10];
    if (n < 30) return "廿" + CN[n - 20];
    return "三十";
  }

  var lunarCache = { key: "", val: "" };
  function lunarLine(d) {
    var key = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    if (lunarCache.key === key) return lunarCache.val;
    var val = "";
    try {
      var f = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { year: "numeric", month: "long", day: "numeric" });
      var parts = f.formatToParts(d);
      var mo = "", day = 0, yn = "";
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === "month") mo = parts[i].value;
        else if (parts[i].type === "day") day = parseInt(parts[i].value, 10);
        else if (parts[i].type === "yearName") yn = parts[i].value;
      }
      if (mo && day) {
        val = "农历" + mo + cnDay(day);
        var z = ZHI.indexOf(yn.charAt(1));
        if (z >= 0) val += " · " + ZODIAC[z] + "年";
      }
    } catch (e) {
      val = "";
    }
    lunarCache.key = key;
    lunarCache.val = val;
    return val;
  }

  /* ---------- 整点报时 ---------- */
  var audioCtx = null;
  var SOUND_FILES = { dingdong: "chime.wav", wood: "wood.wav", bell: "bell.wav", beep: "beep.wav" };
  var soundPlayers = {};
  var soundBroken = {};
  Object.keys(SOUND_FILES).forEach(function (k) {
    var a = new Audio(SOUND_FILES[k]);
    a.preload = "auto";
    a.addEventListener("error", function () { soundBroken[k] = true; });
    soundPlayers[k] = a;
  });

  function volume() {
    var v = Number(S.volume);
    if (isNaN(v)) v = 80;
    return Math.max(0, Math.min(1, v / 100));
  }
  function applyVolume() {
    var v = volume();
    Object.keys(soundPlayers).forEach(function (k) { try { soundPlayers[k].volume = v; } catch (e) {} });
  }

  function synthChime() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var notes = [[1046.5, 0], [783.9, 0.78], [659.3, 1.45]];
      for (var i = 0; i < notes.length; i++) {
        var f = notes[i][0], at = notes[i][1];
        var t0 = audioCtx.currentTime + at;
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        var o2 = audioCtx.createOscillator();
        var g2 = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        o2.type = "sine"; o2.frequency.value = f * 2.02;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.22 * volume(), t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5);
        g2.gain.setValueAtTime(0.0001, t0);
        g2.gain.exponentialRampToValueAtTime(0.06 * volume(), t0 + 0.012);
        g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
        o.connect(g); g.connect(audioCtx.destination);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + 1.6);
        o2.start(t0); o2.stop(t0 + 0.9);
      }
    } catch (e) {}
  }

  function playChime() {
    if (volume() === 0) return;
    var key = SOUND_FILES[S.sound] ? S.sound : "dingdong";
    var a = soundPlayers[key];
    if (!a || soundBroken[key]) { synthChime(); return; }
    applyVolume();
    try {
      a.pause();
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function () { soundBroken[key] = true; synthChime(); });
    } catch (e) {
      soundBroken[key] = true;
      synthChime();
    }
  }

    if (!S.quietOn) return false;

    if (a < b) return h >= a && h < b;
    return h >= a || h < b;

    if (key === lastChimeKey) return;
    lastChimeKey = key;
