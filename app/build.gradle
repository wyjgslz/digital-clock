plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.digitalclock'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.digitalclock"
        minSdk 24
        targetSdk 33
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
